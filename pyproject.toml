[project]
name = "wiki-benchmark"
version = "0.1.0"
description = "Benchmarking Traditional RAG vs LLM-Compiled Knowledge Base (Karpathy Wiki)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "pydantic",
    "pydantic-ai",
    "openai",
    "chromadb",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
